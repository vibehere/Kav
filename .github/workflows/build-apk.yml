name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The release build signs with the debug key, so the fork's own key goes where Gradle looks for it.
      - name: Build
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_USER_HOME"
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d > "$ANDROID_USER_HOME/debug.keystore"
          cd android && ./gradlew --no-daemon assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)"
          TAG="build-$VERSION-${GITHUB_SHA::7}"
          APK="kav-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Kav $VERSION ($TAG)" --notes ''
